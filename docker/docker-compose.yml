# ─────────────────────────────────────────────────────────────────────────────
# snapfeed self-hosted stack (v0.5)
#
# Bring up with:    docker compose -f docker/docker-compose.yml up
# Configure via:    docker/.env  (copy from docker/.env.example first)
#
# Services:
#   worker    Node HTTP server hosting the snapfeed feedback handler
#             (POST /feedback, GET /healthz). Always starts.
#   minio     S3-compatible object storage for feedback media. Always starts.
#   ollama    Optional in-tenant LLM. OFF by default — enable with:
#                 docker compose --profile llm up
#
# Postgres is intentionally NOT included for v0.5. Feedback is appended to
# an audit-log JSONL file, and uploaded media goes to MinIO. A v0.6 release
# will add a Postgres-backed inbox.
#
# Air-gapped notes:
#   - No outbound calls at runtime unless you configure SNAPFEED_* env vars
#     pointing at external services (Slack, GitHub, etc.).
#   - Image tags are named, not pinned by digest — see docker/README.md for
#     reproducible-build guidance.
# ─────────────────────────────────────────────────────────────────────────────

services:
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: snapfeed/worker:0.5.0
    container_name: snapfeed-worker
    restart: unless-stopped
    ports:
      - "${WORKER_PORT:-8787}:8787"
    env_file:
      - ./.env
    environment:
      # Sensible in-container defaults; override in .env if you want different paths.
      SNAPFEED_AUDIT_LOG_PATH: ${SNAPFEED_AUDIT_LOG_PATH:-/data/audit/snapfeed.jsonl}
      SNAPFEED_UPLOAD_DIR: ${SNAPFEED_UPLOAD_DIR:-/data/uploads}
      WORKER_PORT: "8787"
      # Set to "true" only when an upstream proxy/ingress sets X-Forwarded-For
      # AND you trust it (otherwise rate-limit-per-IP is spoofable).
      SNAPFEED_TRUST_PROXY: ${SNAPFEED_TRUST_PROXY:-false}
    volumes:
      - ./data/audit:/data/audit
      - ./data/uploads:/data/uploads
    # Bound the worker so a runaway request loop or memory leak can't take
    # the host down. 512m is generous for a JSON-shuffling Node process; if
    # you ship larger payloads, raise SNAPFEED_MAX_BODY_BYTES first and only
    # bump mem_limit if you actually see OOMs.
    mem_limit: 512m
    pids_limit: 256
    depends_on:
      minio:
        condition: service_healthy

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: snapfeed-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-snapfeed}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-snapfeed-dev-password}
    volumes:
      - ./data/minio:/data
    healthcheck:
      # Use the bundled `mc` CLI — `curl` is NOT present in the minio image,
      # so the previous curl-based healthcheck never passed and the worker
      # (which depends on minio:service_healthy) would never start.
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    container_name: snapfeed-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    # 7B-class models (llama3:8b, mistral:7b) need ~6 GB RAM at runtime;
    # 8 GB gives headroom. Drop to 4g for smaller models like phi3:mini.
    mem_limit: 8g
    healthcheck:
      # Ollama bundles wget on its Ubuntu base; curl is not always present.
      test: ["CMD-SHELL", "wget -qO- http://localhost:11434/api/version || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    profiles:
      - llm
