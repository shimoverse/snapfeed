version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        dependency-type: development
        patterns:
          - '@eslint/*'
          - 'eslint*'
          - 'typescript*'
          - 'tsup'
          - 'vitest'
          - '@vitest/*'
          - 'vite'
      react-peer-surface:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react*'
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:30'
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
