name: Feature request
description: Suggest a new feature or improvement.
title: "[Feature] "
labels: [enhancement, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature. For larger changes, please open a Discussion first — see [CONTRIBUTING.md](https://github.com/shimoverse/snapfeed/blob/main/CONTRIBUTING.md).

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the friction or gap you are running into.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Include API shape if you have one in mind.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why you set them aside.

  - type: dropdown
    id: persona
    attributes:
      label: Which persona does this serve?
      options:
        - Indie / OSS maintainer
        - Startup founder or PM
        - Mid-size engineering manager
        - Corporate engineer or QA lead
        - Designer or PM (consumer of the widget)
        - Other
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Mockups, related projects, prior art.
